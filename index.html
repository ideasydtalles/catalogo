<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Catálogo Ideas &amp; D'talles 2026</title>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        
        :root {
            --primary: #4dc0c0;
            --primary-dark: #3aa8a8;
            --dark-bg: #1f2937;
            --light-bg: #f8fafc;
            --text-main: #1f2937;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; 
            margin: 0;
            line-height: 1.5;
            color: var(--text-main);
            scroll-behavior: smooth;
        }
        
        /* --- HEADER --- */
        .header-bg { background-color: var(--dark-bg); color: white; } 
        #header-container {
            max-width: 80rem; margin: 0 auto; padding: 0.5rem 1.5rem;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        @media (min-width: 640px) { #header-container { flex-direction: row; } }
        .header-logo-info { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
        @media (min-width: 640px) { .header-logo-info { margin-bottom: 0; } }

        /* --- NAVEGACIÓN DE CATEGORÍAS (STICKY) --- */
        .category-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 0.75rem 1rem;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .cat-link {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            transition: all 0.2s;
            background-color: #f1f5f9;
        }
        .cat-link:hover, .cat-link.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(77, 192, 192, 0.3);
        }

        /* --- SECCIONES --- */
        .section-title-container {
            text-align: center;
            margin: 3rem 0 2rem 0;
            position: relative;
            padding: 0 1rem;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark-bg);
            display: inline-block;
            background-color: #f0f4f8;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .section-divider {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #e5e7eb;
            z-index: 0;
        }

        /* --- GRID DE PRODUCTOS --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 2rem;
            max-width: 80rem;
            margin: 0 auto;
            padding: 0 1.5rem 2rem 1.5rem;
        }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

        /* --- TARJETAS --- */
        .product-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #f1f5f9;
            display: flex; flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        .image-container {
            height: 240px;
            background-color: #f8fafc;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .image-container img {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.5s ease;
        }
        .product-card:hover .image-container img { transform: scale(1.05); }

        .card-content { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); line-height: 1.3; }
        .card-desc { font-size: 0.875rem; color: var(--text-light); margin-bottom: 1rem; display: block; overflow: visible; }
        
        /* Precios */
        .price-normal { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); }
        .price-offer { display: flex; flex-direction: column; }
        .badge-offer { background: #ef4444; color: white; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; width: fit-content; margin-bottom: 2px; }
        .price-old { font-size: 0.9rem; text-decoration: line-through; color: #9ca3af; }
        .price-new { font-size: 1.4rem; font-weight: 800; color: #1f2937; }

        .card-actions { padding: 0 1.25rem 1.25rem; display: flex; gap: 0.5rem; }

        /* --- BOTONES --- */
        .btn {
            flex: 1; padding: 0.5rem; font-weight: 600; font-size: 0.9rem;
            border-radius: 0.5rem; border: none; cursor: pointer; transition: all 0.2s;
            text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px); padding-top: 50px; }
        .modal-content { background-color: white; margin: 2% auto; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 1000px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative; animation: slideUp 0.3s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .close-btn { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; cursor: pointer; color: #9ca3af; z-index: 10; }
        .close-btn:hover { color: var(--text-main); }

        .modal-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 768px) { .modal-grid { grid-template-columns: 1fr 1fr; } }

        .main-image-wrapper { 
            background: #f1f5f9; border-radius: 0.75rem; height: 400px; 
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        #modal-main-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; transition: transform 0.3s; }
        .main-image-wrapper.zoomed #modal-main-img { transform: scale(2); cursor: zoom-out; }
        
        .gallery-thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1rem; }
        .thumb { height: 60px; background: #f1f5f9; border-radius: 0.375rem; cursor: pointer; border: 2px solid transparent; overflow: hidden; }
        .thumb.active { border-color: var(--primary); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CARRITO FLOTANTE --- */
        #floating-cart {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 90;
            background-color: var(--primary); color: white;
            padding: 1rem 1.5rem; border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            cursor: pointer; display: flex; align-items: center; gap: 0.75rem;
            font-weight: 700; transition: transform 0.2s;
        }
        #floating-cart:hover { transform: scale(1.05); background-color: var(--primary-dark); }
        #cart-count { background: white; color: var(--primary); padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.875rem; }

        /* --- CARRITO MODAL --- */
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #e5e7eb; }
        .cart-controls button { background: #f3f4f6; border: 1px solid #e5e7eb; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .cart-remove { color: #ef4444; border: none; background: none; cursor: pointer; font-size: 1.2rem; margin-left: 1rem; }
</style>
</head>

<script>
// =========================================================
// VARIABLES GLOBALES
// =========================================================
let productData = {};
let categories = {};

const categoryTitles = {
  amor: "❤️ San Valentín & Amor",
  cultura: "🇪🇨 Cultura Ecuatoriana",
  fandom: "🎵 Fandom: Música & Anime",
  eventos: "✝️ Eventos & Religioso",
  infantil: "🧸 Infantil & Bebés",
  navidad: "Otros productos"
};

// =========================================================
// CARRITO (persistencia)
// =========================================================
let cart = JSON.parse(localStorage.getItem('cart_v6') || '[]');
let currentGallery = [];
let currentProductId = null;

// =========================================================
// HELPERS DE PRECIO
// =========================================================
function parsePrice(priceVal) {
  if (priceVal === null || priceVal === undefined) return 0;
  if (typeof priceVal === 'number') return priceVal;

  const s = String(priceVal)
    .replace('$', '')
    .replace(/\s+/g, '')
    .replace(',', '.');

  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

function formatPrice(priceVal) {
  if (priceVal === null || priceVal === undefined) return '';
  if (typeof priceVal === 'number') return `$${priceVal.toFixed(2)}`;

  const s = String(priceVal).trim();
  if (s.startsWith('$')) return s;

  const n = parseFloat(s.replace(',', '.'));
  return Number.isFinite(n) ? `$${n.toFixed(2)}` : s;
}

// =========================================================
// CARGAR DATOS EXTERNOS
// =========================================================
async function loadCatalogData() {
  try {
    const response = await fetch('productos.json?v=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status} al cargar productos.json`);

    const data = await response.json();
    productData = data.products || {};
    categories  = data.categories || {};

    renderCatalog();
    updateCartUI();
    setupScrollSpy();
  } catch (error) {
    console.error("Error cargando el catálogo:", error);
    document.getElementById('main-content').innerHTML =
      "<p style='text-align:center'>Error cargando productos. Por favor recarga la página.</p>";
  }
}

// =========================================================
// RENDERIZADO
// =========================================================
function renderCatalog() {
  const container = document.getElementById('main-content');
  container.innerHTML = '';

  for (const [key, items] of Object.entries(categories)) {
    const sectionHeader = document.createElement('div');
    sectionHeader.className = 'section-title-container';
    sectionHeader.id = `cat-${key}`;
    sectionHeader.innerHTML = `
      <div class="section-divider"></div>
      <div class="section-title">${categoryTitles[key] || key}</div>
    `;
    container.appendChild(sectionHeader);

    const grid = document.createElement('div');
    grid.className = 'product-grid';

    (items || []).forEach(id => {
      const p = productData[id];
      if (!p) return;

      const priceHtml = `<div class="price-normal">${formatPrice(p.price)}</div>`;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="image-container" onclick="openModal('${id}', '${key}')">
          <img src="${p.mainImg}" alt="${p.title}" loading="lazy">
        </div>
        <div class="card-content">
          <div>
            <div class="card-title">${p.title}</div>
            <div class="card-desc">${p.description}</div>
          </div>
          ${priceHtml}
        </div>
        <div class="card-actions">
          <button class="btn btn-outline" onclick="openModal('${id}', '${key}')">Ver Detalles</button>
          <button class="btn btn-primary" onclick="addToCart('${id}', '${key}')">Añadir</button>
        </div>
      `;
      grid.appendChild(card);
    });

    container.appendChild(grid);
  }
}

// =========================================================
// MODAL PRODUCTO
// =========================================================
function openModal(id, catKey) {
  const p = productData[id];
  if (!p) return;

  currentProductId = id;

  document.getElementById('modal-title').textContent = p.title;
  document.getElementById('modal-desc').textContent = p.description;

  const priceEl = document.getElementById('modal-price');
  priceEl.innerHTML = `<span style="font-size: 2.5rem; color: var(--primary);">${formatPrice(p.price)}</span>`;

  const msg = `Hola, me interesa: ${p.title} (${formatPrice(p.price)})`;
  document.getElementById('modal-whatsapp').href =
    `https://wa.me/593964206952?text=${encodeURIComponent(msg)}`;

  currentGallery = [p.mainImg, ...(p.extraImgs || [])];
  const mainImg = document.getElementById('modal-main-img');
  const thumbs  = document.getElementById('modal-gallery');

  mainImg.src = currentGallery[0] || '';
  thumbs.innerHTML = '';

  if (currentGallery.length > 1) {
    currentGallery.forEach((src, i) => {
      const t = document.createElement('div');
      t.className = `thumb ${i === 0 ? 'active' : ''}`;
      t.innerHTML = `<img src="${src}" alt="thumb" loading="lazy" onclick="switchImg('${src}', this)">`;
      thumbs.appendChild(t);
    });
  }

  const primaryBtn = document.querySelector('#productModal .btn-primary');
  if (primaryBtn) {
    primaryBtn.onclick = () => { addToCart(id, catKey); closeModal(); };
  }

  const wrapper = document.querySelector('.main-image-wrapper');
  if (wrapper) wrapper.classList.remove('zoomed');

  document.getElementById('productModal').style.display = 'block';
}

window.switchImg = function(src, el) {
  document.getElementById('modal-main-img').src = src;
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  if (el && el.parentElement) el.parentElement.classList.add('active');
  const wrapper = document.querySelector('.main-image-wrapper');
  if (wrapper) wrapper.classList.remove('zoomed');
};

function closeModal() {
  document.getElementById('productModal').style.display = 'none';
  const wrapper = document.querySelector('.main-image-wrapper');
  if (wrapper) wrapper.classList.remove('zoomed');
}

// zoom toggle
(function bindZoomToggle(){
  const wrapper = document.querySelector('.main-image-wrapper');
  const img = document.getElementById('modal-main-img');
  if (wrapper && img) {
    img.addEventListener('click', () => wrapper.classList.toggle('zoomed'));
  }
})();

function addToCartFromModal() {
  if (currentProductId) addToCart(currentProductId);
}

// =========================================================
// CARRITO
// =========================================================
function addToCart(id, catKey) {
  const p = productData[id];
  if (!p) return;

  const exist = cart.find(i => i.id === id);
  if (exist) exist.qty++;
  else cart.push({ id, title: p.title, price: parsePrice(p.price), qty: 1 });

  saveCart();

  const btn = document.getElementById('floating-cart');
  btn.style.transform = 'scale(1.2)';
  setTimeout(() => btn.style.transform = 'scale(1)', 200);
}

function updateQty(id, chg) {
  const item = cart.find(i => i.id === id);
  if (item) {
    item.qty += chg;
    if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
    saveCart();
  }
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
}

function saveCart() {
  localStorage.setItem('cart_v6', JSON.stringify(cart));
  updateCartUI();
}

function updateCartUI() {
  const qty = cart.reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

  document.getElementById('cart-count').textContent = qty;
  document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;

  const list = document.getElementById('cart-items-list');
  list.innerHTML = '';

  if (cart.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#9ca3af; margin-top:1rem;">Carrito vacío</p>';
    return;
  }

  cart.forEach(i => {
    list.innerHTML += `
      <div class="cart-item">
        <div>
          <div style="font-weight:700">${i.title}</div>
          <div style="font-size:0.9rem; color:#6b7280">$${i.price.toFixed(2)} x ${i.qty}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <div class="cart-controls">
            <button onclick="updateQty('${i.id}', -1)">-</button>
            <span style="margin:0 0.5rem; font-weight:600">${i.qty}</span>
            <button onclick="updateQty('${i.id}', 1)">+</button>
          </div>
          <button class="cart-remove" onclick="removeFromCart('${i.id}')">×</button>
        </div>
      </div>
    `;
  });
}

function openCartModal() {
  document.getElementById('cartModal').style.display = 'block';
}

function closeCartModal() {
  document.getElementById('cartModal').style.display = 'none';
}

function sendWhatsAppOrder() {
  if (cart.length === 0) return;

  let msg = "¡Hola! Deseo realizar el siguiente pedido:\n\n";
  let total = 0;

  cart.forEach(i => {
    const sub = i.price * i.qty;
    msg += `• ${i.qty}x ${i.title} - $${sub.toFixed(2)}\n`;
    total += sub;
  });

  msg += `\n*TOTAL: $${total.toFixed(2)}*`;
  window.open(`https://wa.me/593964206952?text=${encodeURIComponent(msg)}`, '_blank');
}

// =========================================================
// Scroll Spy (nav activa)
// =========================================================
function setupScrollSpy() {
  window.addEventListener('scroll', () => {
    let current = '';
    document.querySelectorAll('.section-title-container').forEach(section => {
      const sectionTop = section.offsetTop;
      if (scrollY >= sectionTop - 150) current = section.getAttribute('id');
    });

    document.querySelectorAll('.cat-link').forEach(a => {
      a.classList.remove('active');
      if (current && a.getAttribute('href').includes(current)) a.classList.add('active');
    });
  });
}

// =========================================================
// Cierres por click afuera
// =========================================================
window.onclick = function(e) {
  if (e.target && e.target.classList && e.target.classList.contains('modal')) {
    e.target.style.display = 'none';
    const wrapper = document.querySelector('.main-image-wrapper');
    if (wrapper) wrapper.classList.remove('zoomed');
  }
};

// =========================================================
// INICIO
// =========================================================
document.addEventListener('DOMContentLoaded', () => {
  loadCatalogData();
});
